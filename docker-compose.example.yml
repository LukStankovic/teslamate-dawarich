# Drop this service into TeslaMate's own docker-compose.yml. That puts it on the
# same network as TeslaMate, so `database` and `mosquitto` resolve by name.
#
# Dawarich runs in its own Compose project, so pick one of the two ways to reach
# it: join its network (below), or point DAWARICH_URL at the host's LAN address
# and Dawarich's published port.

services:
  teslamate-dawarich:
    image: lukstankovic/teslamate-dawarich:latest
    restart: unless-stopped
    depends_on:
      - database
    environment:
      DAWARICH_URL: http://dawarich_app:3000
      DAWARICH_API_KEY: your_dawarich_api_key
      # Same credentials TeslaMate uses; a read-only role works too.
      TESLAMATE_DB_URL: postgres://teslamate:${DATABASE_PASS}@database:5432/teslamate
      # Optional: sync the moment a position is published instead of polling.
      MQTT_HOST: mosquitto
      LOG_LEVEL: info
    volumes:
      # Holds the sync cursor. Without it, a restart re-syncs INITIAL_LOOKBACK.
      - teslamate-dawarich-data:/data
    networks:
      - default   # database and mosquitto
      - dawarich

volumes:
  teslamate-dawarich-data:

networks:
  # Dawarich declares a network named `dawarich`; Compose prefixes it with the
  # project name. Run `docker network ls | grep dawarich` and use what it prints.
  dawarich:
    external: true
    name: dawarich_dawarich
